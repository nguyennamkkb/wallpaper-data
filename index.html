<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wallpaper Data — Sticker Gallery</title>
  <meta name="description" content="Bộ sưu tập 220 sticker chất lượng cao, 44 pack — tải từ dữ liệu JSON." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0d12;
      --card: #181c26;
      --border: #262b38;
      --text: #e8eaef;
      --muted: #9aa3b2;
      --accent: #6c8cff;
      --accent-2: #a78bfa;
      --grad: linear-gradient(135deg, #6c8cff 0%, #a78bfa 100%);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    .container { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 24px; }

    /* Nav */
    nav {
      position: sticky; top: 0; z-index: 50; backdrop-filter: blur(12px);
      background: rgba(11,13,18,0.72); border-bottom: 1px solid var(--border);
    }
    .nav-inner { display: flex; align-items: center; justify-content: space-between; height: 64px; }
    .logo { font-weight: 800; font-size: 18px; letter-spacing: -0.02em; }
    .logo span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .nav-links { display: flex; gap: 28px; color: var(--muted); font-size: 14px; }
    .nav-links a:hover { color: var(--text); }

    /* Hero */
    .hero { padding: 72px 0 32px; text-align: center; position: relative; overflow: hidden; }
    .hero::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(600px 300px at 50% 0%, rgba(108,140,255,.22), transparent 70%);
    }
    h1 { font-size: clamp(32px, 5.5vw, 56px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; }
    h1 .grad { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .hero p { max-width: 620px; margin: 18px auto 0; color: var(--muted); font-size: 17px; }
    .hero-stats { display: flex; gap: 36px; justify-content: center; margin-top: 36px; flex-wrap: wrap; }
    .stat .num { font-size: 26px; font-weight: 800; }
    .stat .lbl { color: var(--muted); font-size: 12px; }

    /* Toolbar */
    .toolbar { position: sticky; top: 64px; z-index: 40; padding: 16px 0; background: rgba(11,13,18,0.9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
    .search {
      width: 100%; padding: 12px 16px; border-radius: 12px; font-size: 15px;
      background: var(--card); border: 1px solid var(--border); color: var(--text); outline: none;
    }
    .search:focus { border-color: var(--accent); }
    .search::placeholder { color: var(--muted); }

    /* Packs */
    section { padding: 32px 0; }
    .pack { margin-bottom: 40px; }
    .pack-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 16px; }
    .pack-name { font-size: 20px; font-weight: 700; }
    .pack-id { color: var(--muted); font-size: 12px; font-family: ui-monospace, monospace; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; }
    .sticker {
      aspect-ratio: 1/1; border-radius: 14px; overflow: hidden; cursor: pointer;
      background: linear-gradient(135deg, #1a1f2e, #0f1219);
      border: 1px solid var(--border);
      display: grid; place-items: center; padding: 12px;
      transition: transform .15s ease, border-color .15s ease;
    }
    .sticker:hover { transform: translateY(-3px); border-color: #3a4155; }
    .sticker img { width: 100%; height: 100%; object-fit: contain; }
    .sticker .tag {
      position: absolute; bottom: 8px; right: 10px; font-size: 10px;
      color: var(--muted); font-family: ui-monospace, monospace;
    }
    .sticker { position: relative; }

    .empty { text-align: center; color: var(--muted); padding: 40px; }
    .skeleton { height: 140px; border-radius: 14px; background: var(--card); animation: pulse 1.4s infinite; }
    @keyframes pulse { 0%{opacity:.4} 50%{opacity:.85} 100%{opacity:.4} }

    /* Modal */
    .modal {
      position: fixed; inset: 0; z-index: 100; display: none;
      align-items: center; justify-content: center; padding: 24px;
      background: rgba(5,6,10,0.86); backdrop-filter: blur(6px);
    }
    .modal.open { display: flex; }
    .modal-inner {
      background: var(--card); border: 1px solid var(--border); border-radius: 20px;
      padding: 28px; max-width: 520px; width: 100%; text-align: center;
      position: relative;
    }
    .modal-inner img { width: 100%; max-height: 60vh; object-fit: contain; }
    .modal-title { margin-top: 16px; font-weight: 700; font-size: 18px; }
    .modal-sub { color: var(--muted); font-size: 13px; font-family: ui-monospace, monospace; }
    .modal-close {
      position: absolute; top: 12px; right: 14px; width: 34px; height: 34px;
      border-radius: 50%; border: 1px solid var(--border); background: transparent;
      color: var(--text); font-size: 18px; cursor: pointer;
    }
    .modal-close:hover { background: rgba(255,255,255,.06); }

    footer { border-top: 1px solid var(--border); padding: 28px 0; color: var(--muted); font-size: 13px; text-align: center; }
    @media (max-width: 640px) { .nav-links { display: none; } .grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; } }
  </style>
</head>
<body>
  <nav>
    <div class="container nav-inner">
      <div class="logo">Wallpaper<span>Data</span></div>
      <div class="nav-links">
        <a href="#gallery">Stickers</a>
        <a href="data/sticker.json" target="_blank">JSON</a>
      </div>
    </div>
  </nav>

  <header class="hero">
    <div class="container">
      <h1>Bộ sưu tập <span class="grad">Sticker</span></h1>
      <p>220 sticker chất lượng cao, 44 pack — tải trực tiếp từ dữ liệu JSON.</p>
      <div class="hero-stats">
        <div class="stat"><div class="num" id="stat-packs">—</div><div class="lbl">Pack</div></div>
        <div class="stat"><div class="num" id="stat-stickers">—</div><div class="lbl">Sticker</div></div>
        <div class="stat"><div class="num">WebP</div><div class="lbl">Định dạng</div></div>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <div class="container">
      <input class="search" id="search" type="search" placeholder="Tìm pack… (vd: kawaii, weather, tet)" />
    </div>
  </div>

  <main class="container" id="gallery"></main>

  <footer>
    <div class="container">© 2026 Wallpaper Data · Deployed on Cloudflare</div>
  </footer>

  <div class="modal" id="modal">
    <div class="modal-inner">
      <button class="modal-close" id="modal-close" aria-label="Đóng">×</button>
      <img id="modal-img" alt="" />
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-sub" id="modal-sub"></div>
    </div>
  </div>

  <script>
    const gallery = document.getElementById('gallery');
    const search = document.getElementById('search');
    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modal-img');
    const modalTitle = document.getElementById('modal-title');
    const modalSub = document.getElementById('modal-sub');

    let packs = [];

    function imgThumb(packId, id) { return `image/${packId}/${id}_thumb.webp`; }
    function imgBest(packId, id) { return `image/${packId}/${id}.webp`; }

    function render(filter = '') {
      const q = filter.trim().toLowerCase();
      const list = packs.filter(p => !q || p.name.toLowerCase().includes(q) || p.id.includes(q));
      gallery.innerHTML = '';
      if (!list.length) {
        gallery.innerHTML = '<div class="empty">Không tìm thấy pack nào.</div>';
        return;
      }
      for (const pack of list) {
        const el = document.createElement('div');
        el.className = 'pack';
        const grid = pack.stickers.map(id => `
          <div class="sticker" data-pack="${pack.id}" data-id="${id}" data-name="${pack.name}" tabindex="0">
            <img loading="lazy" src="${imgThumb(pack.id, id)}" alt="${pack.name} ${id}" width="160" height="160" />
            <span class="tag">${id}</span>
          </div>`).join('');
        el.innerHTML = `
          <div class="pack-head">
            <div class="pack-name">${pack.name}</div>
            <div class="pack-id">${pack.id}</div>
          </div>
          <div class="grid">${grid}</div>`;
        gallery.appendChild(el);
      }
    }

    function openModal(packId, id, name) {
      modalImg.src = imgBest(packId, id);
      modalImg.alt = `${name} ${id}`;
      modalTitle.textContent = name;
      modalSub.textContent = `${packId} · ${id}`;
      modal.classList.add('open');
    }

    gallery.addEventListener('click', e => {
      const tile = e.target.closest('.sticker');
      if (tile) openModal(tile.dataset.pack, tile.dataset.id, tile.dataset.name);
    });
    gallery.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        const tile = e.target.closest('.sticker');
        if (tile) { e.preventDefault(); openModal(tile.dataset.pack, tile.dataset.id, tile.dataset.name); }
      }
    });
    document.getElementById('modal-close').addEventListener('click', () => modal.classList.remove('open'));
    modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') modal.classList.remove('open'); });

    let t;
    search.addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => render(e.target.value), 120); });

    fetch('data/sticker.json')
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(data => {
        packs = data.packs || [];
        document.getElementById('stat-packs').textContent = packs.length;
        document.getElementById('stat-stickers').textContent = packs.reduce((a, p) => a + p.stickers.length, 0);
        render();
      })
      .catch(err => {
        gallery.innerHTML = '<div class="empty">Không tải được data/sticker.json (' + err.message + ')</div>';
      });
  </script>
</body>
</html>
